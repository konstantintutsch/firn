name: runmap

x-database-url: &database-url postgres://runmap:${POSTGRES_PASSWORD:-runmap}@db/runmap

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: runmap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-runmap}
      POSTGRES_DB: runmap
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U runmap -d runmap]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: backend
      target: runtime
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - path: backend
          action: rebuild
          ignore: [target/]

  web:
    build: frontend
    ports:
      # Localhost only: the map shows where you run and the API has no login.
      - 127.0.0.1:${WEB_PORT:-8080}:80
    depends_on:
      - api
    develop:
      watch:
        - path: frontend
          action: rebuild
          ignore: [node_modules/, _site/]

  tools:
    profiles: [dev]
    build:
      context: backend
      target: tools
    environment:
      DATABASE_URL: *database-url
      TEST_DATABASE_URL: postgres://postgres:test@test-db/postgres
    volumes:
      - ./backend:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/app/target
    depends_on:
      db:
        condition: service_healthy

  # Throwaway database for `just test`, so that tests never touch saved runs.
  test-db:
    profiles: [dev]
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 2s
      timeout: 3s
      retries: 30

  node:
    profiles: [dev]
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db:
  cargo-registry:
  cargo-target:
