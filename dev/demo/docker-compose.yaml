# A separate Firn with made-up data, for screenshots and trying changes out.
# It has its own database and never touches the data of `just up`. Start it
# with `just demo`, at http://localhost:8090.
name: firn-demo

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: firn
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: firn
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U firn -d firn]
      interval: 2s
      timeout: 3s
      retries: 30

  fake-garmin:
    image: python:3.13-alpine
    command: [python, -u, /app/fake_garmin.py]
    volumes:
      - ./fake_garmin.py:/app/fake_garmin.py:ro
      - ./routes.json:/app/routes.json:ro
      - ./marathon.json:/app/marathon.json:ro
      - ./berlin_marathon.json:/app/berlin_marathon.json:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/fitnessage-service/fitnessage/v2/x')"]
      interval: 2s
      timeout: 3s
      retries: 60

  backend:
    build:
      context: ../../backend
      target: runtime
    environment:
      DATABASE_URL: postgres://firn:demo@db/firn
      APP_SECRET: a-public-secret-that-only-the-demo-uses
      GARMIN_BASE_URL: http://fake-garmin:8000
      DOWNLOAD_PAUSE_MS: 0
      PUBLIC_URL: http://localhost:8090
    volumes:
      - data:/data
    healthcheck:
      test: [CMD, firn, healthcheck]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      fake-garmin:
        condition: service_healthy

  frontend:
    build: ../../frontend
    ports:
      - 127.0.0.1:8090:8080
    depends_on:
      backend:
        condition: service_healthy

volumes:
  data:
