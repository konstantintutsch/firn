# Runmap from prebuilt images, for a server with a reverse proxy that serves
# HTTPS and forwards to 127.0.0.1:8080. Put .env next to this file, from
# .env.example, and run `docker compose up -d`.

name: runmap

services:
  db:
    image: postgres:18-alpine
    container_name: runmap-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: runmap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U runmap]
      interval: 5s
      retries: 30

  # The frontend forwards /api to a service of exactly this name.
  backend:
    image: ${RUNMAP_IMAGES:?Set RUNMAP_IMAGES in .env}/backend:${RUNMAP_VERSION:-latest}
    container_name: runmap-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://runmap:${POSTGRES_PASSWORD}@db/runmap
    volumes:
      # Original files and photos of the activities.
      - data:/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ${RUNMAP_IMAGES}/frontend:${RUNMAP_VERSION:-latest}
    container_name: runmap-frontend
    restart: unless-stopped
    ports:
      - 127.0.0.1:8080:80
    depends_on:
      - backend

volumes:
  db:
  data:
