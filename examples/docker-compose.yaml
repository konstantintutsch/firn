# Firn from prebuilt images, for a server with a reverse proxy that serves
# HTTPS and forwards to 127.0.0.1:8080. Put .env next to this file, from
# .env.example, and run `docker compose up -d`.

name: firn

services:
  db:
    image: postgres:18-alpine
    container_name: firn-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: firn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U firn]
      interval: 5s
      retries: 30

  # The frontend forwards /api to a service of exactly this name.
  backend:
    image: ${FIRN_IMAGES:?Set FIRN_IMAGES in .env}/backend:${FIRN_VERSION:-latest}
    container_name: firn-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://firn:${POSTGRES_PASSWORD}@db/firn
    volumes:
      # Original files and photos of the activities.
      - data:/data
    healthcheck:
      test: [CMD, firn, healthcheck]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ${FIRN_IMAGES}/frontend:${FIRN_VERSION:-latest}
    container_name: firn-frontend
    restart: unless-stopped
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db:
  data:
