# Runmap from prebuilt images behind Caddy, which gets a certificate for
# DOMAIN from Let's Encrypt. DOMAIN must point at this server, and ports 80
# and 443 must be free and reachable.
#
# Copy this folder and .env.example, rename the latter to .env, fill it in,
# set RUNMAP_IMAGES and DOMAIN, then run `docker compose up -d`.

name: runmap

x-database-url: &database-url postgres://runmap:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db/runmap

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env, like runmap.example.com}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: runmap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: runmap
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U runmap -d runmap]
      interval: 5s
      timeout: 3s
      retries: 30

  # The web image forwards /api to a service of exactly this name.
  api:
    image: ${RUNMAP_IMAGES:?Set RUNMAP_IMAGES in .env}/runmap-api:${RUNMAP_VERSION:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      PUBLIC_URL: https://${DOMAIN}
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER in .env}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID in .env}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${RUNMAP_IMAGES}/runmap-web:${RUNMAP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - api

volumes:
  db:
  caddy-data:
  caddy-config:
