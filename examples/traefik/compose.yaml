# Runmap from prebuilt images, for a server that already runs Traefik with a
# certificate resolver. Joins Traefik's network and routes DOMAIN to Runmap.
#
# Set TRAEFIK_NETWORK, TRAEFIK_ENTRYPOINT and TRAEFIK_CERTRESOLVER to match
# your Traefik, besides the settings from .env.example and DOMAIN.

name: runmap

x-database-url: &database-url postgres://runmap:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db/runmap

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: runmap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: runmap
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U runmap -d runmap]
      interval: 5s
      timeout: 3s
      retries: 30

  # The web image forwards /api to a service of exactly this name.
  api:
    image: ${RUNMAP_IMAGES:?Set RUNMAP_IMAGES in .env}/runmap-api:${RUNMAP_VERSION:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      PUBLIC_URL: https://${DOMAIN:?Set DOMAIN in .env, like runmap.example.com}
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER in .env}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID in .env}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${RUNMAP_IMAGES}/runmap-web:${RUNMAP_VERSION:-latest}
    restart: unless-stopped
    networks: [default, traefik]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.runmap.rule: Host(`${DOMAIN}`)
      traefik.http.routers.runmap.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.runmap.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.services.runmap.loadbalancer.server.port: "80"
    depends_on:
      - api

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true

volumes:
  db:
