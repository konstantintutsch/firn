# Checks the code, then builds the backend and frontend images, and pushes them
# to the container registry of this Gitea instance as <owner>/<repository>/<component>.
# Pull requests only check and build, to see that the images work.
#
# Set up:
# - Secret REGISTRY_TOKEN: an access token with the write:package scope.
# - Variable REGISTRY_USER (optional): who owns the token. Defaults to whoever
#   started the run.
# - Variable REGISTRY (optional): another registry, like ghcr.io. Defaults to
#   this Gitea instance.
# - Variable PLATFORMS (optional): like linux/amd64,linux/arm64. Defaults to
#   linux/amd64. Other platforms build under emulation, which is slow for Rust.
#
# Tags: the branch, the short commit, latest for main, and 1.2.3, 1.2 and 1
# for a tag v1.2.3.
#
# Gitea also offers the github context used below, which keeps actionlint working.

name: Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # The same checks as `just lint` and `just test`, against a throwaway database.
  backend:
    runs-on: ubuntu-latest
    container: rust:1.99-bookworm
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:test@postgres/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- --deny warnings
      - run: cargo test --locked

  frontend:
    runs-on: ubuntu-latest
    container: node:24-alpine
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  image:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            target: runtime
          - component: frontend
            target: ""
    steps:
      - uses: actions/checkout@v4

      - name: Name the image
        id: name
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          registry="${REGISTRY:-${SERVER_URL#*://}}"
          # Registries only accept lowercase names.
          echo "registry=${registry%/}" >> "$GITHUB_OUTPUT"
          echo "image=${registry%/}/${REPOSITORY,,}/${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-qemu-action@v3
        if: vars.PLATFORMS != '' && vars.PLATFORMS != 'linux/amd64'

      # On the network of the Docker daemon, so that BuildKit uses its resolver.
      # Otherwise a daemon in Docker (dind) hands BuildKit public DNS servers,
      # which do not know a registry on a local network.
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ steps.name.outputs.registry }}
          username: ${{ vars.REGISTRY_USER || github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          target: ${{ matrix.target }}
          platforms: ${{ vars.PLATFORMS || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pull requests read the cache, but only pushes write it.
          cache-from: type=registry,ref=${{ steps.name.outputs.image }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache,mode=max', steps.name.outputs.image) || '' }}
