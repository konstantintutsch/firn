# Behind a reverse proxy, every request comes from the proxy's address. This
# takes the client's address from the X-Forwarded-For header instead, so that
# each client has its own limit below. Only Docker's networks may set it, which
# is where a proxy on the host or in a container connects from. Anyone else
# could name any address and dodge the limit.
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Slows down guessing at sign-ins. One zone for all clients' addresses.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types application/json text/javascript application/javascript text/css
        image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # The map loads its style, tiles and fonts from OpenFreeMap, and place search
    # asks Photon. MapLibre also starts its worker from a blob: URL.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://tiles.openfreemap.org https://photon.komoot.io; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;

    # File names stay the same across versions, so browsers ask again each time
    # and get a short "not modified" while nothing changed.
    add_header Cache-Control no-cache always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Browsers refuse to run ES modules served with nginx's default type for .mjs.
    location ~ \.mjs$ {
        types { }
        default_type text/javascript;
    }

    location /api/ {
        # Resolves on each request, because a rebuilt backend container gets a new address.
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_set_header Host $host;

        # Without the policy above: the API documentation runs inline scripts.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }

    # Imports and exports can be gigabytes and take minutes. The upload goes
    # straight to the backend, which limits its size itself.
    location ~ ^/api/(import|export)$ {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 30m;
        proxy_send_timeout 30m;

        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_set_header Host $host;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }

    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;

        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_set_header Host $host;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }
}
