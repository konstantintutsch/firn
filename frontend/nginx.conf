server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json text/javascript text/css;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }

    # Browsers refuse to run ES modules served with nginx's default type for .mjs.
    location ~ \.mjs$ {
        types { }
        default_type text/javascript;
    }

    location /api/ {
        # Resolves on each request, because a rebuilt backend container gets a new address.
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }
}
