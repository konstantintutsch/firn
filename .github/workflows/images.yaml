# Checks the code, then builds the backend and frontend images, and pushes them
# to the GitHub container registry as ghcr.io/<owner>/<repository>/<component>.
# Pull requests only check and build, to see that the images work.
#
# Set up: nothing. The workflow pushes with the GITHUB_TOKEN of the run.
# - Variable PLATFORMS (optional): like linux/amd64,linux/arm64. Defaults to
#   linux/amd64. Other platforms build under emulation, which is slow for Rust.
#
# Tags: the branch, the short commit, and 1.2.3, 1.2, 1 and latest for a tag
# v1.2.3. A prerelease tag like v1.2.3-rc.1 only gets 1.2.3-rc.1 and never latest.

name: Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # The same checks as `just lint` and `just test`, against a throwaway database.
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The version of docker-compose.yaml.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # Rust in the version of the Dockerfile.
      - name: Install Rust
        run: rustup toolchain install 1.99 --profile minimal --component rustfmt,clippy --no-self-update --default
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- --deny warnings
      - run: cargo test --locked

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  image:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            target: runtime
          - component: frontend
            target: ""
    steps:
      - uses: actions/checkout@v4

      - name: Name the image
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          # Registries only accept lowercase names.
          echo "image=ghcr.io/${REPOSITORY,,}/${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          # latest=auto: latest goes to stable version tags only.
          flavor: latest=auto
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/setup-qemu-action@v3
        if: vars.PLATFORMS != '' && vars.PLATFORMS != 'linux/amd64'

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          target: ${{ matrix.target }}
          platforms: ${{ vars.PLATFORMS || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pull requests read the cache, but only pushes write it.
          cache-from: type=registry,ref=${{ steps.name.outputs.image }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache,mode=max', steps.name.outputs.image) || '' }}
