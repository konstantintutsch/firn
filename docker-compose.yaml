name: firn

x-database-url: &database-url postgres://firn:${POSTGRES_PASSWORD:-firn}@db/firn

services:
  db:
    image: postgres:18-alpine
    container_name: firn-db
    environment:
      POSTGRES_USER: firn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-firn}
      POSTGRES_DB: firn
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U firn -d firn]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: backend
      target: runtime
    container_name: firn-backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: *database-url
    volumes:
      - data:/data
    healthcheck:
      test: [CMD, firn, healthcheck]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - path: backend
          action: rebuild
          ignore: [target/]

  frontend:
    build: frontend
    container_name: firn-frontend
    ports:
      # Localhost by default. Set WEB_BIND to 0.0.0.0 to serve other machines,
      # ideally behind a reverse proxy with HTTPS.
      - ${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080
    depends_on:
      backend:
        condition: service_healthy
    develop:
      watch:
        - path: frontend
          action: rebuild
          ignore: [node_modules/, _site/]

  tools:
    profiles: [dev]
    build:
      context: backend
      target: tools
    environment:
      DATABASE_URL: *database-url
      TEST_DATABASE_URL: postgres://postgres:test@test-db/postgres
    volumes:
      - ./backend:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/app/target
    depends_on:
      db:
        condition: service_healthy

  # Throwaway database for `just test`, so that tests never touch saved activities.
  test-db:
    profiles: [dev]
    image: postgres:18-alpine
    container_name: firn-test-db
    environment:
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 2s
      timeout: 3s
      retries: 30

  node:
    profiles: [dev]
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db:
  data:
  cargo-registry:
  cargo-target:
